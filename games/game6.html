<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Judge — Class 6 Game</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Cairo','sans-serif']}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Cairo',sans-serif}
@keyframes pop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .3s ease}
.stampBtn{transition:all .15s;transform-origin:center}
.stampBtn:hover{transform:translateY(-4px) scale(1.04)}
.stampBtn:active{transform:scale(0.95)}
.gavel{animation:gv .8s ease-in-out infinite}
@keyframes gv{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.bar{transition:width .5s}
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300">

<header class="bg-gradient-to-l from-amber-500 via-orange-600 to-red-600 text-white shadow-lg sticky top-0 z-50">
  <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
    <a href="../class6.html" class="text-sm font-bold bg-white/15 px-3 py-2 rounded-full">← الدرس</a>
    <h1 class="text-base md:text-lg font-bold">⚖️ Change Judge</h1>
    <button onclick="toggleDarkMode()" class="bg-white/15 px-3 py-2 rounded-full text-sm"><span id="theme-icon">🌙</span></button>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-6">

  <div class="flex gap-3 justify-between mb-5 flex-wrap">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-5 py-2 flex-1 text-center min-w-[90px]">
      <div class="text-[10px] text-amber-500 font-bold">CASE</div>
      <div id="level" class="text-lg font-extrabold leading-none">1/6</div>
    </div>
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-5 py-2 flex-1 text-center min-w-[90px]">
      <div class="text-[10px] text-emerald-500 font-bold">CORRECT</div>
      <div id="score" class="text-lg font-extrabold text-emerald-500 leading-none">0</div>
    </div>
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-5 py-2 flex-1 text-center min-w-[90px]">
      <div class="text-[10px] text-purple-500 font-bold">STREAK 🔥</div>
      <div id="streak" class="text-lg font-extrabold text-purple-500 leading-none">0</div>
    </div>
  </div>

  <!-- The CR card -->
  <div id="crCard" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-lg overflow-hidden pop">
    <div class="bg-gradient-to-l from-amber-500 to-red-600 text-white p-4">
      <div class="flex items-center gap-3">
        <span class="text-3xl gavel">⚖️</span>
        <div>
          <div class="text-[10px] text-amber-100 font-bold">CHANGE REQUEST</div>
          <div id="crId" class="text-lg font-extrabold">CR-001</div>
        </div>
      </div>
    </div>
    <div class="p-5 space-y-3 text-sm">
      <div class="border-b border-slate-100 dark:border-slate-800 pb-2"><span class="text-[10px] font-bold text-slate-400">CHANGE</span><p id="crChange" class="font-semibold"></p></div>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-blue-50 dark:bg-blue-950/30 rounded-lg p-3"><span class="text-[10px] font-bold text-blue-500">SOURCE</span><p id="crSource" class="text-xs font-semibold mt-1"></p></div>
        <div class="bg-emerald-50 dark:bg-emerald-950/30 rounded-lg p-3"><span class="text-[10px] font-bold text-emerald-500">VALUE</span><p id="crValue" class="text-xs font-semibold mt-1"></p></div>
        <div class="bg-amber-50 dark:bg-amber-950/30 rounded-lg p-3"><span class="text-[10px] font-bold text-amber-500">URGENCY</span><p id="crUrgency" class="text-xs font-semibold mt-1"></p></div>
        <div class="bg-pink-50 dark:bg-pink-950/30 rounded-lg p-3"><span class="text-[10px] font-bold text-pink-500">IMPACT</span><p id="crImpact" class="text-xs font-semibold mt-1"></p></div>
      </div>
      <div class="bg-slate-50 dark:bg-slate-800/50 rounded-lg p-3">
        <span class="text-[10px] font-bold text-slate-400">PROPAGATION RISK</span>
        <div class="flex items-center gap-2 mt-1">
          <div class="flex-1 h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
            <div id="riskBar" class="bar h-full bg-gradient-to-l from-emerald-500 via-amber-500 to-red-500" style="width:20%"></div>
          </div>
          <span id="riskTicks" class="text-xs font-bold">●●○○○</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Verdict buttons -->
  <div id="verdicts" class="grid grid-cols-3 gap-3 mt-5">
    <button onclick="verdict('Accept',this)" class="stampBtn bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl p-4 font-bold shadow-md">
      <div class="text-3xl mb-1">✅</div>ACCEPT<div class="text-[10px] font-normal opacity-80">اقبل</div>
    </button>
    <button onclick="verdict('Defer',this)" class="stampBtn bg-amber-500 hover:bg-amber-600 text-white rounded-2xl p-4 font-bold shadow-md">
      <div class="text-3xl mb-1">⏸️</div>DEFER<div class="text-[10px] font-normal opacity-80">أجل</div>
    </button>
    <button onclick="verdict('Reject',this)" class="stampBtn bg-red-500 hover:bg-red-600 text-white rounded-2xl p-4 font-bold shadow-md">
      <div class="text-3xl mb-1">🚫</div>REJECT<div class="text-[10px] font-normal opacity-80">ارفض</div>
    </button>
  </div>

  <!-- Feedback -->
  <div id="feedback" class="hidden mt-5 rounded-2xl p-5 pop"></div>

</main>

<script>
const CASES = [
  {
    id:"CR-001", change:"تغيير لون الأزرار من الأزرق إلى البمبي في شاشة الدخول",
    source:"CEO (الرئيس التنفيذي)", value:"جماليات فقط — لا يحل مشكلة", urgency:"عادي جداً",
    impact:"إعادة اختبار 3 شاشات", ticks:3,
    answer:"Reject",
    why:"القيمة (جماليات فقط) لا تبرر التكلفة (إعادة اختبار 3 شاشات). مثال كلاسيكي على REJECT — لا تحل مشكلة حقيقية."
  },
  {
    id:"CR-002", change:"إضافة 'استرداد كلمة المرور' — 40% من المستخدمين لا يستطيعون الدخول",
    source:"فريق الدعم (مخوّل)", value:"عالية جداً — تحل مشكلة حقيقية", urgency:"عاجل 🔥",
    impact:"وحدة جديدة + أسبوعين", ticks:2,
    answer:"Accept",
    why:"قيمة عالية + مصدر مخوّل + عاجل → ACCEPT. لاحظ: قبل القبول لازم نمر بـ Impact Analysis (trace lines, new lines, verification...)."
  },
  {
    id:"CR-003", change:"دعم اللغة الفرنسية — السوق الفرنسي يفتح بعد 6 أشهر",
    source:"مدير المبيعات", value:"جيدة لتوسيع السوق", urgency:"مو عاجل — بعد 6 أشهر",
    impact:"ترجمة + تعديلات كثيرة", ticks:3,
    answer:"Defer",
    why:"القيمة موجودة بس الوقت ما حان → DEFER للإصدار القادم. لا داعي لإضافته الآن وتضييق الموعد النهائي."
  },
  {
    id:"CR-004", change:"تغيير نظام الدفع بالكامل من Stripe إلى PayPal",
    source:"مطور جديد (غير مخوّل)", value:"تفضيل شخصي فقط", urgency:"مو عاجل",
    impact:"كسر 5 متطلبات + 3 أشهر", ticks:5,
    answer:"Reject",
    why:"⚠️ المصدر غير مخوّل + propagation risk 5 تيكات (تغيير واحد يكسر خمسة) → REJECT. هذا المتطلب 'ملعوب' بخمسة أشياء."
  },
  {
    id:"CR-005", change:"إضافة زر 'تصدير تقرير الحضور' — المدير طلبه لنهاية الربع",
    source:"المدير (Authority)", value:"تقارير إدارية مطلوبة", urgency:"قبل نهاية الربع",
    impact:"وحدة جديدة، ما يكسر شي", ticks:1,
    answer:"Accept",
    why:"مصدر مخوّل + قيمة واضحة + propagation risk منخفض (تيك واحد) → ACCEPT. وسهل التتبع."
  },
  {
    id:"CR-006", change:"إضافة 'وضع الواقع الافتراضي 3D' لعرض الحضور",
    source:"صديق المدير", value:"فكرة 'حلوة' بدون مستخدمين طالبين", urgency:"مو عاجل",
    impact:"تقنية جديدة كلياً + مخاطر غير معروفة", ticks:4,
    answer:"Reject",
    why:"⚠️ مصدر غير مخوّل (صديق!) + قيمة غير مثبتة + مخاطر غير معروفة → REJECT. أو على الأقل Defer حتى يثبت أحد حاجتها."
  }
];

let level = 0, score = 0, streak = 0, answered = false;

function renderCase() {
  answered = false;
  const c = CASES[level];
  document.getElementById('level').textContent = (level+1)+"/"+CASES.length;
  document.getElementById('crId').textContent = c.id;
  document.getElementById('crChange').textContent = c.change;
  document.getElementById('crSource').textContent = c.source;
  document.getElementById('crValue').textContent = c.value;
  document.getElementById('crUrgency').textContent = c.urgency;
  document.getElementById('crImpact').textContent = c.impact;
  document.getElementById('riskBar').style.width = (c.ticks/5*100)+"%";
  document.getElementById('riskTicks').textContent = "●".repeat(c.ticks)+"○".repeat(5-c.ticks);
  document.getElementById('feedback').classList.add('hidden');
  // re-enable buttons
  document.querySelectorAll('#verdicts button').forEach(b=>b.disabled=false);
}

function verdict(choice, btn) {
  if (answered) return;
  answered = true;
  const c = CASES[level];
  document.querySelectorAll('#verdicts button').forEach(b=>b.disabled=true);
  const fb = document.getElementById('feedback');
  const ok = choice === c.answer;
  if (ok) {
    score++; streak++;
    document.getElementById('score').textContent = score;
    document.getElementById('streak').textContent = streak;
    fb.className = 'mt-5 rounded-2xl p-5 pop bg-emerald-50 dark:bg-emerald-950/30 border-2 border-emerald-400';
    fb.innerHTML = `<div class="text-3xl mb-1">⚖️✅</div><b class="text-emerald-700 dark:text-emerald-300">حكم صحيح! ${c.answer}</b><p class="text-sm mt-2 text-slate-600 dark:text-slate-300">${c.why}</p>`;
  } else {
    streak = 0;
    document.getElementById('streak').textContent = 0;
    fb.className = 'mt-5 rounded-2xl p-5 pop bg-red-50 dark:bg-red-950/30 border-2 border-red-400';
    fb.innerHTML = `<div class="text-3xl mb-1">⚖️💥</div><b class="text-red-700 dark:text-red-300">حكم خاطئ! الصح: ${c.answer}</b><p class="text-sm mt-2 text-slate-600 dark:text-slate-300">${c.why}</p>`;
  }
  setTimeout(()=>{
    level++;
    if (level >= CASES.length) {
      fb.className = 'mt-5 rounded-2xl p-5 pop bg-gradient-to-l from-amber-500 to-red-600 text-white text-center';
      fb.innerHTML = `<div class="text-5xl mb-2">🏛️</div><b class="text-2xl">انتهت الجلسة!</b><p class="mt-2 text-amber-50">حكمت بشكل صحيح في ${score} من ${CASES.length} قضية. ${score>=5?'🌟 قاضي محترف!':score>=3?'👍 حكم جيد، راجع معايير القبول':'⚖️ تحتاج مراجعة الدرس'}</p><div class="flex gap-2 justify-center mt-4"><a href="../class6.html" class="bg-white/20 px-4 py-2 rounded-full text-sm font-bold">📖 الدرس</a><button onclick="restart()" class="bg-white text-amber-700 px-4 py-2 rounded-full text-sm font-bold">جلسة جديدة</button></div>`;
      return;
    }
    renderCase();
  }, 2800);
}

function restart() {
  level = 0; score = 0; streak = 0;
  document.getElementById('score').textContent = 0;
  document.getElementById('streak').textContent = 0;
  renderCase();
}

if(localStorage.getItem('theme')==='dark'||(!('theme' in localStorage)&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
function toggleDarkMode(){document.documentElement.classList.toggle('dark');localStorage.setItem('theme',document.documentElement.classList.contains('dark')?'dark':'light');document.getElementById('theme-icon').textContent=document.documentElement.classList.contains('dark')?'☀️':'🌙'}
if(document.documentElement.classList.contains('dark'))document.getElementById('theme-icon').textContent='☀️';

renderCase();
</script>
</body>
</html>
